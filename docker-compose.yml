# 연금 ETF 최적화 — 실제 ETF DB(별도 MySQL 컨테이너) 연동 구성
#
# 전제: 실제 etf_db 를 담은 MySQL 이 로컬에서 이미 실행 중 (root/mysql, 포트 3306)
#       backend 컨테이너는 host.docker.internal:3306 으로 접속한다.
#
# 실행:  docker compose up -d --build
# 접속:  http://localhost:8888  (웹/모바일 시뮬레이션)
#
# ⚠ API 키 등 비밀값은 이 파일에 직접 쓰지 않는다 (저장소에 커밋되면 유출됨).
#    프로젝트 루트에 .env 파일을 만들면 compose 가 자동으로 읽어 ${VAR} 를 치환한다.
#    (.env 는 gitignore 되어 있음 — 템플릿은 .env.example 참조)
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pension-backend
    environment:
      ETF_DB_HOST: host.docker.internal   # 호스트에서 실행 중인 실제 MySQL
      ETF_DB_PORT: "3306"
      ETF_DB_USER: root
      ETF_DB_PASSWORD: mysql
      ETF_DB_NAME: etf_db_260909
      # ---- 유니버스/분류 규칙 (선택, 기본값은 backend/config.py 참조) ----
      # UNIVERSE_REQUIRE_PENSION: "1"     # pension 값이 있는 상품만 (0 이면 전체)
      # SAFE_FUND_TYPES: "채권형,단기금융,금리형,채권혼합형,혼합채권형"
      # MAX_SAFE_CANDIDATES: "10"
      # ---- LLM 설정 — 키 값은 .env 에서 주입 (여기에 직접 쓰지 말 것!) ----
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_MODEL: ${LLM_MODEL:-}
      AGENT_LLM_INPUT: ${AGENT_LLM_INPUT:-}
      AGENT_LLM_ACCOUNT: ${AGENT_LLM_ACCOUNT:-}
      AGENT_LLM_SEARCH: ${AGENT_LLM_SEARCH:-}
      AGENT_LLM_OPTIMIZATION: ${AGENT_LLM_OPTIMIZATION:-}
      AGENT_LLM_EVALUATION: ${AGENT_LLM_EVALUATION:-gemini:gemini-3.5-flash}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux 호환 (macOS/Windows 는 기본 제공)
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: pension-frontend
    depends_on:
      - backend
    ports:
      - "8888:80"
